<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Especialidades · MediCitas</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <main class="container">
        <div class="page-header">
            <h1>Especialidades</h1>
        </div>

        <section class="table-wrap" style="padding: 20px; margin-bottom: 20px;">
            <h2 id="form-title">Nueva especialidad</h2>

            <form id="specialty-form" novalidate>
                <div class="form-row">
                    <div class="form-group" data-field="name">
                        <label for="name">Nombre <span class="required">*</span></label>
                        <input type="text" id="name" name="name" maxlength="100">
                        <p class="field-error"></p>
                    </div>
                    <div class="form-group" data-field="description">
                        <label for="description">Descripción</label>
                        <input type="text" id="description" name="description" maxlength="255">
                        <p class="field-error"></p>
                    </div>
                </div>

                <p class="alert alert-error" id="form-error" hidden></p>
                <p class="alert alert-success" id="form-success" hidden></p>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submit-btn">Crear</button>
                    <button type="button" class="btn btn-secondary" id="cancel-btn" hidden>Cancelar</button>
                </div>
            </form>
        </section>

        <section>
            <p class="alert alert-info" id="empty-message" hidden>No hay especialidades registradas.</p>
            <div class="table-wrap" id="table-wrap" hidden>
                <table>
                    <thead>
                        <tr>
                            <th style="width: 60px;">ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th style="width: 120px;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="specialties-tbody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script type="module" src="/js/specialties.js"></script>
</body>
</html>
