<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pacientes · MediCitas</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <main class="container">
        <div class="page-header">
            <h1>Pacientes</h1>
        </div>

        <section class="table-wrap" style="padding: 20px; margin-bottom: 20px;">
            <h2 id="form-title">Nuevo paciente</h2>

            <form id="patient-form" novalidate>
                <div class="form-row">
                    <div class="form-group" data-field="national_id">
                        <label for="national_id">Cédula <span class="required">*</span></label>
                        <input type="text" id="national_id" name="national_id" maxlength="20">
                        <p class="field-error"></p>
                    </div>
                    <div class="form-group" data-field="birth_date">
                        <label for="birth_date">Fecha de nacimiento</label>
                        <input type="date" id="birth_date" name="birth_date">
                        <p class="field-error"></p>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group" data-field="first_name">
                        <label for="first_name">Nombres <span class="required">*</span></label>
                        <input type="text" id="first_name" name="first_name" maxlength="100">
                        <p class="field-error"></p>
                    </div>
                    <div class="form-group" data-field="last_name">
                        <label for="last_name">Apellidos <span class="required">*</span></label>
                        <input type="text" id="last_name" name="last_name" maxlength="100">
                        <p class="field-error"></p>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group" data-field="phone">
                        <label for="phone">Teléfono <span class="required">*</span></label>
                        <input type="text" id="phone" name="phone" maxlength="20">
                        <p class="field-error"></p>
                    </div>
                    <div class="form-group" data-field="email">
                        <label for="email">Email</label>
                        <input type="text" id="email" name="email" maxlength="150">
                        <p class="field-error"></p>
                    </div>
                </div>

                <div class="form-group" data-field="is_active" id="is-active-group" hidden>
                    <label>
                        <input type="checkbox" id="is_active" name="is_active">
                        Activo
                    </label>
                    <p class="field-error"></p>
                </div>

                <p class="alert alert-error" id="form-error" hidden></p>
                <p class="alert alert-success" id="form-success" hidden></p>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submit-btn">Crear</button>
                    <button type="button" class="btn btn-secondary" id="cancel-btn" hidden>Cancelar</button>
                </div>
            </form>
        </section>

        <section>
            <div class="form-row" style="margin-bottom: 12px;">
                <div class="form-group" style="margin: 0;">
                    <label for="search">Buscar por cédula o nombre</label>
                    <input type="text" id="search" placeholder="Cédula, nombres o apellidos">
                </div>
                <div class="form-group" style="margin: 0;">
                    <label for="filter-active">Filtrar por estado</label>
                    <select id="filter-active">
                        <option value="">Todos</option>
                        <option value="true">Activos</option>
                        <option value="false">Inactivos</option>
                    </select>
                </div>
            </div>

            <p class="alert alert-info" id="empty-message" hidden>No se encontraron pacientes.</p>
            <div class="table-wrap" id="table-wrap" hidden>
                <table>
                    <thead>
                        <tr>
                            <th>Cédula</th>
                            <th>Paciente</th>
                            <th>Nacimiento</th>
                            <th>Teléfono</th>
                            <th>Email</th>
                            <th style="width: 90px;">Estado</th>
                            <th style="width: 110px;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="patients-tbody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script type="module" src="/js/patients.js"></script>
</body>
</html>
